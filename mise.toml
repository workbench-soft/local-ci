[tools]
node = "24"
"npm:markdownlint-cli2" = "0.24.0"
pnpm = "12.16.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.lint]
description = "Lint and format check the dashboard and the install scripts"
run = [
  "markdownlint-cli2",
  "pnpm --dir dashboard lint",
  "pnpm --dir dashboard format:check",
  "shellcheck install.sh runner/install.sh runner/oracle.sh",
  "shfmt -i 0 -d install.sh runner/install.sh runner/oracle.sh",
]

[tasks.format]
description = "Format the dashboard with oxfmt"
run = "pnpm --dir dashboard format"

[tasks.demo]
description = "Take the README screenshots of the status page, with made up runs"
dir = "dashboard"
tools = { oxipng = "10.2.1" }
run = ["node --no-warnings demo/run.ts", "oxipng -o 4 --strip safe ../docs/screenshots/*.png"]
