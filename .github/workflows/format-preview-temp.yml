name: Temporary formatter diff

on:
  push:
    branches: [fix/webos-tv-cache-first-20261121]

permissions:
  contents: read

jobs:
  diff:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: dashboard
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ runner.temp }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise x -- pnpm exec oxfmt .
      - name: Print exact formatter changes
        run: git --no-pager diff -- cards/local-main-button.tsx status/local-main-sync.ts status/webos-inventory.ts status/webos-inventory.test.ts
