name: Checks

# Runs the status page checks and lints the installers on pushes to main and on PRs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The repo is public, so jobs run on GitHub runners: a fork PR on the PC runner would run its code there.
# Each action is pinned to a commit, and Dependabot moves the pin and its version comment.
permissions:
  contents: read

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  dashboard:
    # The installers and the page are for Windows, so the checks run on Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      # The Windows runner checks out with CRLF endings, and oxfmt then flags every file.
      - run: git config --global core.autocrlf false
        working-directory: ${{ runner.temp }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise x -- pnpm lint
      - run: mise x -- pnpm format:check
      - run: mise x -- pnpm typecheck
      - run: mise x -- pnpm test
      - run: mise x -- pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  scripts:
    runs-on: windows-latest
    steps:
      # The Windows runner checks out with CRLF endings, and oxfmt then flags every file.
      - run: git config --global core.autocrlf false
        working-directory: ${{ runner.temp }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A cached markdownlint-cli2 came back without its unicorn-magic package, so this job installs fresh.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      # The same scripts as the lint task in mise.toml.
      # The release and skill scripts keep their own indent, so only shellcheck reads them.
      - run: shellcheck .github/scripts/next-version.sh .github/scripts/release-notes.sh .agents/skills/fix-stuck-ci/ci-status.sh
      - run: shellcheck install.sh runner/install.sh runner/oracle.sh && shfmt -i 0 -d install.sh runner/install.sh runner/oracle.sh
      - run: markdownlint-cli2
      # A syntax error in a .ps1 file shows only when a person runs it.
      - shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object FullName -notmatch 'node_modules' | ForEach-Object {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($_.Name):$($e.Extent.StartLineNumber) $($e.Message)"; $bad++ }
          }
          exit $bad
