name: Release

# Release starts beside Checks on each push; publication waits for that commit's Checks.
# The release carries notes only, since the repo builds no file to ship. The update task on the Windows PC
# installs it within 5 minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.sha }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # One release at a time, so each one reads the tag of the one before and picks a free version.
    # A later push waits in line instead of cancelling a release that already waits for its Checks.
    concurrency:
      group: release
      cancel-in-progress: false
    # The repo is public, so GitHub runners cost 0 minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The release notes and the next version need every earlier tag and commit.
          fetch-depth: 0

      - name: Wait for matching Checks before publication
        run: bash .github/scripts/wait-for-checks.sh

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      # A tag pushed with the workflow token doesn't start other workflows.
      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          git tag "$TAG" "$SHA"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
