name: One-time formatting
on:
  push:
    branches: [feat/lumiere-webos-install-all-tvs]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/lumiere-webos-install-all-tvs
          persist-credentials: true
      - name: Apply repository formatter
        run: |
          npm exec --yes --package=oxfmt@0.75.0 -- oxfmt --write dashboard/status/install-webos.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dashboard/status/install-webos.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply oxfmt to installer changes"
            git push origin HEAD:feat/lumiere-webos-install-all-tvs
          fi
