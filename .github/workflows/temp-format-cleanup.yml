name: Temporary format cleanup PR 120

on:
  push:
    branches: [feat/cleanup-actions-artifacts-and-old-apk-releases]

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: mise x -- pnpm install --frozen-lockfile
        working-directory: dashboard
      - run: mise x -- pnpm exec oxfmt cards/storage-cleanup-button.tsx status/storage-cleanup-actions.ts status/storage-cleanup.test.ts
        working-directory: dashboard
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/cards/storage-cleanup-button.tsx dashboard/status/storage-cleanup-actions.ts dashboard/status/storage-cleanup.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format storage cleanup files"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
